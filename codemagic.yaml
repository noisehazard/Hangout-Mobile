# Builds an UNSIGNED iOS development client so it can be signed on Windows with a
# free Apple ID (Sideloadly) — no paid Apple Developer Program needed.
# See docs/ios-free-sideload.md for the full workflow.
#
# Only the native shell is built here. Your JavaScript is served at runtime by
# Metro on your dev machine (`npx expo start --dev-client --tunnel`), so this
# build needs no Supabase keys or other secrets.

workflows:
  ios-dev-client-unsigned:
    name: iOS dev client (unsigned, free-ID sideloading)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install JS dependencies
        script: npm ci

      - name: Generate the native iOS project
        script: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        script: cd ios && pod install

      - name: Build unsigned .app for device
        script: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building scheme $SCHEME from $WORKSPACE"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SKIP_BUNDLING=1 \
            SKIP_BUNDLING_METRO_IP=1 \
            build
          # SKIP_BUNDLING keeps the JS bundle out of the binary (the dev client
          # loads it from Metro). SKIP_BUNDLING_METRO_IP stops React Native from
          # baking this CI machine's LAN IP into the app as a dev-server hint.

      - name: Package the .app into an .ipa
        script: |
          cd ios/build/Build/Products/Debug-iphoneos
          rm -rf Payload Hangout-dev-client.ipa
          mkdir -p Payload
          cp -R *.app Payload/
          zip -qry Hangout-dev-client.ipa Payload
          ls -lh Hangout-dev-client.ipa

    artifacts:
      - ios/build/Build/Products/Debug-iphoneos/*.ipa
      - ios/build/Build/Products/Debug-iphoneos/*.app

    # Optional: get the .ipa mailed to you instead of downloading from the UI.
    # publishing:
    #   email:
    #     recipients:
    #       - your@email.example
    #     notify:
    #       success: true
    #       failure: true
